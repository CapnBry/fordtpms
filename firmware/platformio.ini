[platformio]
; `pio run` without -e builds (and uploads) only this board
default_envs = c3-lr1121

[env]
platform = espressif32@7.1.3
framework = espidf
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
board_upload.flash_size = 4MB
monitor_filters = esp32_exception_decoder, colorize
; Two 1700 KB OTA app slots (room for OTA updates later); must match sdkconfig.defaults
board_build.partitions = partitions_two_ota_large.csv
; Web UI page, also listed as EMBED_TXTFILES in src/CMakeLists.txt
board_build.embed_txtfiles = src/web/index.html

; TTGO / LilyGO LoRa32 v2.1: ESP32-PICO-D4 + SX1278 + SSD1306
[env:ttgo-lora32-v21]
board = ttgo-lora32-v21
upload_speed = 921600

; ESP32-C3 + LR1121 receiver (ExpressLRS "Unified ESP32C3 LR1121" layout) on a
; CH340 USB-TTL adapter with no DTR/RTS auto-reset. Upload sends the CLI
; `bootloader` command first (tools/c3_upload.py), and esptool resets into the
; new firmware with the RTC watchdog. If the board isn't running this firmware,
; hold BOOT while powering it up instead.
[env:c3-lr1121]
board = esp32-c3-devkitm-1
upload_port = /dev/ttyAMA0
monitor_port = /dev/ttyAMA0
upload_speed = 2000000
board_upload.before_reset = no_reset
board_upload.after_reset = watchdog_reset
extra_scripts = pre:tools/c3_upload.py
