[platformio]
; `pio run` without -e builds (and uploads) only this board
default_envs = c3-lr1121

[env]
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB
monitor_filters = esp32_exception_decoder, colorize
; Two 1700 KB OTA app slots (src/ota.c); must match sdkconfig.defaults
board_build.partitions = partitions_two_ota_large.csv
; Web UI pages, also listed as EMBED_TXTFILES in src/CMakeLists.txt
board_build.embed_txtfiles =
    src/web/index.html
    src/web/oled.html

; 30-pin ESP32 DevKit (ESP32-WROOM-32) + CC1101 module, pins in src/board.h
[env:esp32-cc1101]
board = esp32dev
upload_speed = 921600

; ESP32-C3 + LR1121 receiver (ExpressLRS "Unified ESP32C3 LR1121" layout) on a
; CH340 USB-TTL adapter with no DTR/RTS auto-reset. Upload sends the CLI
; `bootloader` command first (tools/c3_upload.py), and esptool resets into the
; new firmware with the RTC watchdog. If the board isn't running this firmware,
; hold BOOT while powering it up instead.
[env:c3-lr1121]
board = esp32-c3-devkitm-1
upload_speed = 2000000
board_upload.before_reset = no_reset
board_upload.after_reset = watchdog_reset
extra_scripts = pre:tools/c3_upload.py

; Same firmware as the USB envs above, flashed over Wi-Fi via HTTP POST /update
; (tools/ota_upload.py, src/ota.h). Both boards answer to fordtpms.local, so
; with both on the network pick one by the IP the `wifi` command shows:
;   pio run -e c3-lr1121-ota -t upload --upload-port <ip>:80
; The `:80` matters: an upload_port that looks like a bare IP or *.local name
; makes the builder switch to espota, which this firmware doesn't run. Sending
; the wrong board's image is refused as soon as its header arrives.
[env:esp32-cc1101-ota]
extends = env:esp32-cc1101
upload_protocol = custom
upload_port = fordtpms.local:80
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/ota_upload.py" "$UPLOAD_PORT" "$SOURCE"

; No c3_upload.py pre-upload hook here.
[env:c3-lr1121-ota]
extends = env:c3-lr1121
extra_scripts =
upload_protocol = custom
upload_port = fordtpms.local:80
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/ota_upload.py" "$UPLOAD_PORT" "$SOURCE"
